name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    name: Lint a testy (PowerShell, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ochrana dat – žádné výstupy auditů ani ID v repozitáři
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^reports/' ; then
            echo "::error::Složka reports/ nesmí být v Gitu (výstupy auditů)."; exit 1
          fi
          # GUIDs could be tenant or app IDs. Allowed: the public Microsoft Graph appId.
          hits=$(git ls-files -z | xargs -0 grep -nEoI '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' \
                 | grep -v '00000003-0000-0000-c000-000000000000' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Nalezeno GUID – ověřte, že nejde o ID tenantu nebo aplikace."; exit 1
          fi

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $results = @(
            Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
            Invoke-ScriptAnalyzer -Path ./tests/Invoke-AuditTests.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          )
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer: $($results.Count) nálezů" }

      - name: Offline testy (simulované moduly, fiktivní data)
        shell: pwsh
        run: ./tests/Invoke-AuditTests.ps1
